services:
  spider:
    image: spider:${IMAGE_VERSION:?IMAGE_VERSION is required}-linux-${IMAGE_ARCH:?IMAGE_ARCH is required}
    container_name: spider
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/etc/proxy:ro

  netfilter:
    image: netfilter:${IMAGE_VERSION:?IMAGE_VERSION is required}-linux-${IMAGE_ARCH:?IMAGE_ARCH is required}
    container_name: netfilter
    restart: unless-stopped

    network_mode: host
    init: true

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=16m

    env_file:
      - .env

    depends_on:
      - spider

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
